<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ジェネリックPDF — 文字入れ・押印・署名・結合・分割・回転・透かし・パスワード・墨消し。アップロードしない、ブラウザだけで動くPDFツール</title>
<meta name="description" content="PDFに文字を書く・印影を押す・手書き署名・結合・分割・並べ替え・回転・トリミング・透かし・ページ番号・フォーム記入・パスワード保護と解除・墨消し・画像との相互変換・圧縮。ファイルはあなたのPCから出ません。会員登録もカード登録もなし。0円。日本語 / English。">
<meta property="og:title" content="ジェネリックPDF">
<meta property="og:description" content="有名なPDF編集サービスと同じ効能を、添加物なしで。ファイルはあなたのPCから出ません。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ilove-ai.net/pdf">
<meta property="og:image" content="https://ilove-ai.net/pdf/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://ilove-ai.net/pdf">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<!--
  ジェネリックPDF v1.0.0 / Generic PDF
  ─────────────────────────────────────────────────────────────
  このファイル1つで動きます。ダブルクリックで開いても、https://ilove-ai.net/pdf で開いても同じです。
  This single file is the whole app. Open it locally or at https://ilove-ai.net/pdf — same thing.

  データの扱い（守っていること） / What never happens:
  - PDF も画像も、FileReader でブラウザのメモリに読むだけです。
  - fetch / XMLHttpRequest でファイル本体を送る処理は、このファイルの中に存在しません。
    ネットワークに出るのは「ライブラリ」「日本語フォント」「Web フォント（見た目用）」の取得だけです。
    Nothing you open is ever sent anywhere. The only network requests are for libraries and fonts.
  - 保存は Blob を a[download] で落とすだけ。localStorage に置くのは言語（gp-lang）と左右パネルの開閉（gp-ui）だけです。
  - 閉じれば全部消えます。

  ライブラリ（すべてバージョン固定・必要になったときだけ読み込む） / Libraries (pinned, loaded on demand):
  - pdf-lib 1.17.1 (MIT)              https://github.com/Hopding/pdf-lib
  - @pdf-lib/fontkit 1.1.1 (MIT)      https://github.com/Hopding/fontkit
  - pdf.js 4.10.38 (Apache-2.0)       https://github.com/mozilla/pdf.js
  - qpdf-wasm 0.0.2 (Apache-2.0)      https://github.com/jsscheller/qpdf-wasm  … パスワード保護・解除・劣化なし圧縮のときだけ
  - Noto Sans JP (OFL-1.1)            https://github.com/notofonts/noto-cjk    … 日本語を書くときだけ
-->
<style>
  :root{
    --bg:#FFFFFF; --fg:#000000; --mute:#666666; --faint:#DDDDDD; --stage:#EFEFEF;
    --line:1px solid var(--fg);
    --sans:"Inter","Noto Sans JP",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){ :root{ --bg:#000000; --fg:#FFFFFF; --mute:#999999; --faint:#333333; --stage:#121212; } }
  *{ box-sizing:border-box; margin:0; padding:0; }
  [hidden]{ display:none !important; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--fg); font:16px/1.6 var(--sans); }
  button, input, select, textarea{ font:inherit; color:inherit; background:var(--bg); border:var(--line); border-radius:0; }
  button{ cursor:pointer; padding:8px 16px; transition:background .12s, color .12s; }
  button:hover{ background:var(--fg); color:var(--bg); }
  button.primary{ background:var(--fg); color:var(--bg); }
  button.primary:hover{ background:var(--bg); color:var(--fg); }
  button[disabled]{ opacity:.4; cursor:default; }
  button[disabled]:hover{ background:var(--bg); color:var(--fg); }
  button.primary[disabled]:hover{ background:var(--fg); color:var(--bg); }
  a{ color:inherit; }
  .mono{ font-family:var(--mono); }
  .mute{ color:var(--mute); }
  .sr{ position:absolute; left:-9999px; }

  /* ── 骨格 ── */
  #app{ display:grid; grid-template-rows:auto 1fr; height:100%; }
  header{ display:flex; align-items:center; gap:16px; padding:0 16px; height:56px; border-bottom:var(--line); overflow:hidden; }
  header h1{ font-size:16px; font-weight:700; white-space:nowrap; }
  header button{ white-space:nowrap; flex:none; }
  header #fname{ min-width:0; max-width:36vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
  header .ver{ font-family:var(--mono); font-size:12px; color:var(--mute); }
  header .spacer{ flex:1; }
  header a.gh{ font-family:var(--mono); font-size:12px; text-decoration:none; border-bottom:1px solid currentColor; white-space:nowrap; }
  header button.lang{ font-family:var(--mono); font-size:12px; padding:4px 10px; }
  /* 左右のパネルは hidden で畳む。列は auto なので畳むと幅 0 になり、中央が広がる */
  main{ display:grid; grid-template-columns:auto 1fr auto; min-height:0; }
  /* 列は明示する。自動配置だと、左を畳んだときに中央が左の列（auto）へ落ちて広がらない */
  nav.tools{ grid-column:1; width:208px; border-right:var(--line); display:flex; flex-direction:column; overflow-y:auto; }
  #stage{ grid-column:2; }
  aside.props{ grid-column:3; }
  /* パネルの畳み込み。開いているときは上端の « »、畳んだあとは幅 28px の帯に » « を残して戻せる */
  .fold{ flex:none; border:0; border-bottom:var(--line); font-family:var(--mono); font-size:14px; padding:4px 12px; text-align:right; line-height:1.4; }
  aside.props .fold{ text-align:left; }
  .rail{ grid-row:1; width:28px; border:0; padding:8px 0 0; font-family:var(--mono); font-size:14px; line-height:1; align-self:stretch; }
  #rail-l{ grid-column:1; border-right:var(--line); }
  #rail-r{ grid-column:3; border-left:var(--line); }
  nav.tools button.sel{ border-bottom:var(--line); }
  nav.tools .grp{ font-family:var(--mono); font-size:11px; color:var(--mute); padding:12px 16px 4px; border-bottom:var(--line); }
  nav.tools button{ border:0; border-bottom:var(--line); text-align:left; padding:10px 16px; display:flex; gap:12px; align-items:baseline; line-height:1.4; }
  nav.tools button .no{ font-family:var(--mono); font-size:12px; width:24px; flex:none; }
  nav.tools button[aria-pressed="true"]{ background:var(--fg); color:var(--bg); }
  nav.tools .sub{ font-size:11px; color:var(--mute); display:block; }
  nav.tools button[aria-pressed="true"] .sub{ color:var(--bg); opacity:.7; }
  #stage{ overflow:hidden; position:relative; background:var(--bg); min-height:0; }
  #stage .pagewrap{ display:grid; grid-template-rows:auto 1fr; height:100%; min-height:0; }
  #pageinfo{ font-family:var(--mono); font-size:12px; display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; padding:8px 12px; border-bottom:1px solid var(--faint); }
  #pageinfo button{ padding:2px 10px; }
  #pageinfo select{ padding:2px 4px; font-size:12px; font-family:var(--mono); }
  #pageinfo input{ width:3.4em; padding:2px 4px; font-size:12px; font-family:var(--mono); text-align:center; -moz-appearance:textfield; }
  #pageinfo input::-webkit-outer-spin-button, #pageinfo input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  #pageinfo .sep{ width:1px; height:16px; background:var(--faint); }
  /* スクロール面。全ページを縦に並べる（Acrobat と同じ連続表示）。
     ページは margin:auto の block なので、狭いときは中央・広いときは左端から全部たどれる
     （flex の align-items:center だと、はみ出した左側がスクロールで届かなくなる） */
  #scroller{ overflow:auto; position:relative; background:var(--stage); }
  #pages{ width:max-content; min-width:100%; padding:24px 24px 40vh; }
  .pageview{ position:relative; border:var(--line); line-height:0; touch-action:none; background:#fff; margin:0 auto 16px; }
  .pageview canvas{ display:block; }
  .pageview .overlay{ position:absolute; inset:0; overflow:hidden; }
  #pages.cross .overlay{ cursor:crosshair; }
  #pages.hand .overlay{ cursor:grab; }
  #scroller.panning, #scroller.panning .overlay{ cursor:grabbing; }
  .band{ position:absolute; border:1px dashed var(--fg); pointer-events:none; }
  .inktemp{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  aside.props{ width:296px; border-left:var(--line); display:flex; flex-direction:column; min-height:0; font-size:14px; }
  #props-body{ padding:24px; overflow:auto; flex:1; min-height:0; }
  aside.props h2{ font-family:var(--mono); font-size:12px; font-weight:400; color:var(--mute); margin-bottom:8px; }
  aside.props h3{ font-size:13px; font-weight:700; margin:24px 0 8px; padding-top:16px; border-top:1px solid var(--faint); }
  aside.props .row{ margin-bottom:16px; }
  aside.props label{ display:block; font-family:var(--mono); font-size:12px; color:var(--mute); margin-bottom:4px; }
  aside.props label.chk{ display:flex; gap:8px; align-items:center; font-family:var(--sans); font-size:14px; color:var(--fg); }
  aside.props input[type=text], aside.props input[type=number], aside.props input[type=password], aside.props textarea, aside.props select{ width:100%; padding:8px; }
  aside.props input[type=range]{ width:100%; }
  aside.props textarea{ min-height:88px; resize:vertical; }
  aside.props .btns{ display:flex; gap:8px; flex-wrap:wrap; }
  aside.props .btns button{ padding:6px 12px; font-size:14px; }
  aside.props p.note{ font-size:12px; color:var(--mute); }
  aside.props .warn{ border:var(--line); padding:8px; font-size:12px; }
  /* 2列を固定幅に。キー列を折り返し禁止にすると説明列が1文字ずつ折れて表が崩れる */
  aside.props table.keys{ width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed; }
  aside.props table.keys td{ border-top:1px solid var(--faint); padding:4px 0; vertical-align:top; overflow-wrap:anywhere; }
  aside.props table.keys td:first-child{ font-family:var(--mono); color:var(--mute); padding-right:8px; width:50%; }
  aside.props ul.plain{ list-style:none; font-size:13px; }
  aside.props ul.plain li{ padding:4px 0; border-top:1px solid var(--faint); }
  aside.props .two{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  aside.props .field{ border-top:1px solid var(--faint); padding:8px 0; }
  aside.props .field b{ font-size:12px; font-family:var(--mono); font-weight:400; display:block; color:var(--mute); }

  /* ── 注釈（オーバーレイ上の要素） ── */
  .annot{ position:absolute; border:1px dashed transparent; user-select:none; cursor:move; }
  .annot.selected{ border-color:var(--fg); }
  .annot.text{ white-space:pre; line-height:1.2; padding:0; }
  .annot.image img{ width:100%; height:100%; display:block; pointer-events:none; }
  .annot .handle{ position:absolute; right:-6px; bottom:-6px; width:12px; height:12px; background:var(--fg); cursor:nwse-resize; display:none; }
  .annot.selected .handle{ display:block; }
  .annot.shape.rect{ border-style:solid; }
  .annot.shape.highlight{ background:rgba(255,235,0,.55); mix-blend-mode:multiply; }
  .annot.shape.white{ background:#fff; }
  #pages.shape-mode .annot.shape.white{ outline:1px dashed #999; }
  .annot.redact{ background:#000; }
  svg.annot{ overflow:visible; border:0; pointer-events:none; }
  svg.annot.selected{ outline:1px dashed var(--fg); }
  svg.annot path, svg.annot line{ fill:none; stroke-linecap:round; stroke-linejoin:round; }
  svg.annot .hit{ stroke:transparent; stroke-width:12; pointer-events:visibleStroke; cursor:move; }
  .prev{ position:absolute; pointer-events:none; white-space:nowrap; line-height:1; }
  .prev.crop{ border:1px dashed var(--fg); box-shadow:0 0 0 9999px rgba(128,128,128,.35); }
  .prev.cropdraft{ border:2px solid var(--fg); }

  /* ── ドロップ画面 ── */
  #drop{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:24px; overflow:auto; }
  #drop .box{ border:1px dashed var(--fg); width:min(720px,100%); padding:56px 24px; text-align:center; cursor:pointer; }
  #drop .box.over{ background:var(--fg); color:var(--bg); }
  #drop h2{ font-size:24px; font-weight:700; margin-bottom:16px; }
  #drop p{ font-size:14px; }
  #drop ul{ list-style:none; margin-top:24px; font-size:14px; line-height:2; }
  #drop .cant{ width:min(720px,100%); font-size:12px; color:var(--mute); line-height:1.8; }
  #drop .cant b{ color:var(--fg); font-weight:400; font-family:var(--mono); }

  /* ── ページ一覧（サムネイル） ── */
  #thumbs{ display:flex; flex-direction:column; gap:8px; }
  .thumb{ display:grid; grid-template-columns:64px 1fr; gap:8px; border:var(--line); padding:8px; align-items:center; cursor:pointer; }
  .thumb.current{ background:var(--fg); color:var(--bg); }
  .thumb.current button{ background:var(--fg); color:var(--bg); border-color:var(--bg); }
  .thumb.current button:hover{ background:var(--bg); color:var(--fg); }
  .thumb canvas{ width:64px; border:1px solid var(--mute); display:block; }
  .thumb .meta{ font-family:var(--mono); font-size:11px; }
  .thumb .meta b{ display:block; font-size:12px; }
  .thumb .ops{ display:flex; gap:4px; margin-top:4px; }
  .thumb .ops button{ padding:2px 8px; font-size:12px; }

  #status{ position:fixed; left:16px; bottom:16px; font-family:var(--mono); font-size:12px; background:var(--bg); border:var(--line); padding:8px 12px; display:none; max-width:calc(100% - 32px); z-index:5; }
  #status.show{ display:block; }

  /* ── スマホ ──
     PC の3カラムを縦に積むのではなく、上に効能チップ・中央に紙・下に1行のバー。設定はバーから出すシート */
  #sheetbar{ display:none; }
  @media (max-width:768px){
    main{ grid-template-columns:1fr; grid-template-rows:auto 1fr auto auto; }
    nav.tools{ grid-column:1; grid-row:1; width:auto; flex-direction:row; border-right:0; border-bottom:var(--line); overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    nav.tools::-webkit-scrollbar{ display:none; }
    nav.tools .grp{ display:none; }
    nav.tools button{ border-bottom:0; border-right:var(--line); white-space:nowrap; padding:9px 12px; font-size:14px; gap:6px; }
    nav.tools button .no{ width:auto; font-size:11px; }
    nav.tools .sub{ display:none; }
    #stage{ grid-column:1; grid-row:2; }
    #sheetbar{ display:flex; grid-column:1; grid-row:3; align-items:center; justify-content:space-between; gap:8px; padding:6px 12px; border-top:var(--line); font-size:13px; }
    #sheetbar #sheet-title{ font-family:var(--mono); font-size:12px; color:var(--mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #sheetbar button{ padding:4px 12px; font-size:13px; flex:none; }
    aside.props{ grid-column:1; grid-row:4; width:auto; border-left:0; border-top:1px solid var(--faint); max-height:50vh; }
    #props-body{ padding:12px 16px; }
    .fold, .rail{ display:none !important; }
    aside.props .keysblock{ display:none; }
    aside.props .row{ margin-bottom:12px; }
    #pages{ padding:8px 8px 30vh; }
    .pageview{ margin-bottom:8px; }
    #pageinfo{ gap:8px; padding:6px 8px; }
    #pageinfo #pagesize{ display:none; }
    header{ gap:8px; height:48px; padding:0 8px; }
    header h1{ font-size:14px; white-space:nowrap; }
    header .ver, header a.gh, header #fname{ display:none; }
    header button{ padding:6px 10px; font-size:14px; white-space:nowrap; }
    #drop{ padding:12px; gap:12px; justify-content:flex-start; }
    #drop .box{ padding:28px 16px; }
    #drop h2{ font-size:18px; margin-bottom:8px; }
    #drop p{ font-size:13px; }
    #drop ul{ margin-top:12px; font-size:13px; line-height:1.8; }
    #drop .cant{ font-size:11px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>ジェネリックPDF</h1>
    <span class="ver">v1.0.0</span>
    <a class="gh" href="https://github.com/takumi-golf/generic-pdf" target="_blank" rel="noopener" data-t="source">ソース →</a>
    <span class="spacer"></span>
    <span id="fname" class="mono mute"></span>
    <button id="btn-add" hidden data-t="add">＋ 追加</button>
    <button id="btn-save" class="primary" hidden data-t="save">保存 ↓</button>
    <button id="btn-lang" class="lang" aria-label="Language">EN</button>
  </header>
  <main>
    <nav class="tools" id="tools" aria-label="tools"></nav>
    <button id="rail-l" class="rail" hidden>»</button>
    <section id="stage">
      <div id="drop">
        <div class="box" id="dropbox" role="button" tabindex="0">
          <h2 data-t="drop.title">ここにPDFをドロップ</h2>
          <p class="mono" data-t="drop.or">または タップして選ぶ（PDF・PNG・JPG）</p>
          <ul>
            <li data-t="drop.p1">アップロードしません</li>
            <li data-t="drop.p2">会員登録もカード登録もありません</li>
            <li data-t="drop.p3">閉じれば全部消えます</li>
          </ul>
        </div>
        <div class="cant"><b data-t="cant.head">できないこと</b> <span data-t="cant.body">既存の文字や画像そのものの書き換え（上から重ねるだけ）／Word・Excel への変換／PDF/A・PDF/X への変換／証明書による電子署名（見た目の署名は可）／2つのPDFの比較／OCR（文字認識）。OCR 以外は対応する予定がありません。</span></div>
      </div>
      <div class="pagewrap" id="pagewrap" hidden>
        <div id="pageinfo">
          <button id="btn-prev">←</button>
          <input id="pageinput" type="number" min="1" value="1" aria-label="page"><span id="pagetotal">/ 1</span>
          <button id="btn-next">→</button>
          <span id="pagesize" class="mute"></span>
          <span class="sep"></span>
          <button id="btn-zoomout" aria-label="zoom out">−</button>
          <select id="zoomsel" aria-label="zoom"></select>
          <button id="btn-zoomin" aria-label="zoom in">＋</button>
        </div>
        <div id="scroller"><div id="pages"></div></div>
      </div>
    </section>
    <div id="sheetbar"><span id="sheet-title"></span><button id="sheet-toggle"></button></div>
    <button id="rail-r" class="rail" hidden>«</button>
    <aside class="props" id="props"><button class="fold" id="fold-r">»</button><div id="props-body"></div></aside>
  </main>
</div>
<div id="status" role="status"></div>
<input id="file-pdf" class="sr" type="file" accept="application/pdf,.pdf,image/png,image/jpeg,.png,.jpg,.jpeg" multiple>
<input id="file-img" class="sr" type="file" accept="image/png,image/jpeg,.png,.jpg,.jpeg">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

if (!window.PDFLib || !window.fontkit) {
  const st = document.getElementById("status");
  st.textContent = "部品（pdf-lib / fontkit）を読み込めませんでした。ネットワークを確認して再読み込みしてください。 / Could not load pdf-lib / fontkit. Check your network and reload.";
  st.classList.add("show");
  throw new Error("libraries not loaded");
}
const { PDFDocument, StandardFonts, degrees, rgb, BlendMode, LineCapStyle, LineJoinStyle,
  pushGraphicsState, popGraphicsState, setLineWidth, setStrokingColor, setLineCap, setLineJoin, moveTo, lineTo, stroke } = PDFLib;
const VERSION = "1.0.0";
const HOST = "https://ilove-ai.net";
// 同梱サブセットは同一オリジン（本番・ローカル配信）を先に試し、単体で開いたとき（file://）は本番から取る
const FONT_SUBSET_PATH = "/pdf/fonts/NotoSansJP-Regular.subset.otf";
const FONT_SUBSET_URLS = location.protocol === "file:" ? [HOST + FONT_SUBSET_PATH] : [FONT_SUBSET_PATH, HOST + FONT_SUBSET_PATH];
const FONT_FULL_URL = "https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/Sans/SubsetOTF/JP/NotoSansJP-Regular.otf";
const QPDF_BASE = "https://cdn.jsdelivr.net/npm/@jspawn/qpdf-wasm@0.0.2/";
const WARN_BYTES = 100 * 1024 * 1024;

function renderThumbs(withOps = true) {

  box.innerHTML = "";
  state.pages.forEach((p, i) => {

      ${withOps ? `<div class="ops"><button data-op="up"${i === 0 ? " disabled" : ""}>↑</button><button data-op="down"${i === state.pages.length - 1 ? " disabled" : ""}>↓</button><button data-op="del">×</button></div>` : ""}`;

}

function parseRange(text, n) {

    const m = part.match(/^(\d+)(?:-(\d+))?$/); if (!m) return [];

function fieldKind(f) {

async function renderFormFields(p) {
  const src = sourceOf(p);

    if (kind === "text") return `<div class="field">${label}${f.isMultiline() ? `<textarea data-i="${i}">${escapeHtml(v ?? f.getText() ?? "")}</textarea>` : `<input type="text" data-i="${i}" value="${escapeHtml(v ?? f.getText() ?? "")}">`}</div>`;

    if (kind === "radio" || kind === "dropdown" || kind === "list") {

    }

  });

/* 記入内容を元PDFに焼き付ける（flatten）。元のバイト列は残しておき「元に戻す」で戻せる */
async function applyForm(src) {
  const draft = src.formDraft || {};
  try {
    status(t("building"), 0);
    const doc = await PDFDocument.load(src.bytes, { ignoreEncryption: true, updateMetadata: false });
    doc.registerFontkit(fontkit);
    const form = doc.getForm();
    let needJp = false;
    for (const f of form.getFields()) {
      const name = f.getName(); if (!(name in draft)) continue;
      const v = draft[name]; const kind = fieldKind(f);
      if (kind === "text") { f.setText(String(v)); if (!isAscii(String(v))) needJp = true; }
      else if (kind === "check") { v ? f.check() : f.uncheck(); }
      else if (kind === "radio" || kind === "dropdown") { if (v) f.select(String(v)); else if (kind === "dropdown") f.clear(); }
      else if (kind === "list") { f.select(Array.isArray(v) ? v : [v]); }
    }
    if (needJp) { const bytes = await fontFor(Object.values(draft).map(String).join("")); form.updateFieldAppearances(await doc.embedFont(bytes, { subset: true })); }
    else form.updateFieldAppearances();
    form.flatten({ updateFieldAppearances: false });
    const out = (await doc.save()).buffer;
    if (!src.original) src.original = src.bytes;
    src.bytes = out; src.lib = null; src.pdf = await pdfjsLib.getDocument({ data: out.slice(0), isEvalSupported: false }).promise; src.formDraft = null; src.pageCache = null; src.gen = (src.gen || 0) + 1;
    status(t("form.done"));
    render();
  } catch (e) { status(t("saveFail", { err: e && e.message ? e.message : e }), 8000); }
}

/* PDF → 画像。1ページなら画像1枚、複数なら zip（無圧縮）にまとめる */

  const c = state.convert;

  if (!idx.length) { status(t("badRange")); return; }
  try {
    status(t("rasterizing"), 0);
    const merged = await (await buildPdf({ only: idx })).save();
    const pdf = await pdfjsLib.getDocument({ data: merged, isEvalSupported: false }).promise;
    const files = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const vp = page.getViewport({ scale: c.dpi / 72 });
      const cv = document.createElement("canvas"); cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);

/* zip（無圧縮 store）。外部ライブラリを増やさないために最小限で書いている */

/* ───────────── 画像の選択（印影・透かし） ─────────────*/
el.fileImg.addEventListener("change", async () => {
  const f = el.fileImg.files[0]; el.fileImg.value = ""; if (!f) return;

/* 左右のパネルの開閉。畳むと中央が広がるので幅に合わせ直す */
